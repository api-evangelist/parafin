description: >-
  Parafin's first-party client libraries are published under the @parafin npm
  scope (all MIT-licensed). They are framework bindings for the embeddable
  Parafin Elements widget (the capital/spend/pay-over-time UX), plus the shared
  embedded core. No first-party server-side SDKs (Python, Go, Ruby, Java, .NET)
  or CLI were found on the public registries; server integrations call the REST
  API directly with an OAuth bearer token (see authentication/).
