apis:
- name: Parafin API
  description: >-
    White-labeled embedded finance REST API for offering business financing —
    creating businesses, persons, and bank accounts; generating capital offers;
    creating capital, line-of-credit, and pay-over-time applications; and
    orchestrating order checkout. OAuth client-credentials authentication with
    short-lived bearer tokens redeemed via POST /v1/auth/redeem_token. Production
    host api.parafin.com; sandbox host api.dev.parafin.com.
