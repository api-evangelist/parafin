name: Parafin
description: >-
  Parafin is an embedded finance infrastructure company (founded 2020) that lets
  software platforms, marketplaces, and payment service providers offer capital,
  spend, and pay-over-time products to the small businesses on their platform.
  Parafin abstracts the hardest parts of launching a business-financing product —
  capital sourcing, regulatory and compliance know-how, underwriting and risk
  modeling, servicing, and collections — behind white-labeled REST APIs and
  embeddable UI widgets (Parafin Elements) shipped for React, Vue, and Angular.
  Products include Capital (revenue-based cash advances and flex term loans),
  Line of Credit, Spend (card and cash account), and Pay Over Time. Platforms
  integrate via a no-code option (Parafin Lite), low-code embedded Elements, or a
  custom API build. Notable customers include DoorDash and Mindbody. Backed by
  GGV Capital, Redpoint Ventures, and Ribbit Capital.
